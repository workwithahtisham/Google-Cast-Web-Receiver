
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartCast Pro</title>
  <link rel="icon" href="assets/smartcast-receiver-icon.png">
  <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cyan: #00e3fd;
      --mint: #4dffbe;
      --violet: #7c5cff;
      --ink: #020407;
      --text: #f7fbff;
      --muted: rgba(247,251,255,0.62);
      --panel: rgba(8,18,24,0.74);
      --line: rgba(255,255,255,0.13);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--ink);
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --playback-logo-image: none;
    }

    /* The player must remain the base layer. */
    cast-media-player {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: block;
      z-index: 1;
      --theme-hue: 190;
      --progress-color: rgba(0,0,0,0);
      --play-image: none;
      --pause-image: none;
      --buffering-image: none;
      --watermark-image: none;
      --splash-image: none;
      --splash-color: #000000;
    }

    #mirror-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 5;
      display: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .overlay.hidden { display: none; }

    #idle-screen,
    #loading-overlay,
    #error-overlay {
      background:
        linear-gradient(125deg, rgba(0,227,253,0.18) 0%, rgba(0,0,0,0) 36%),
        linear-gradient(235deg, rgba(124,92,255,0.16) 0%, rgba(0,0,0,0) 34%),
        linear-gradient(180deg, #041018 0%, #020407 52%, #000000 100%);
    }

    #idle-screen::before,
    #idle-screen::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    #idle-screen::before {
      background-image:
        linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
      background-size: 72px 72px;
      -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent 78%);
      mask-image: linear-gradient(to bottom, rgba(0,0,0,0.75), transparent 78%);
      opacity: 0.38;
    }

    #idle-screen::after {
      background:
        linear-gradient(100deg, transparent 0%, rgba(0,227,253,0.18) 46%, transparent 56%),
        linear-gradient(42deg, transparent 0%, rgba(77,255,190,0.11) 38%, transparent 48%);
      animation: sweep 9s ease-in-out infinite alternate;
      opacity: 0.56;
    }

    @keyframes sweep {
      from { transform: translateX(-5%) translateY(2%); }
      to { transform: translateX(5%) translateY(-2%); }
    }

    .idle-shell {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 34px 48px 34px;
      min-width: min(520px, calc(100vw - 72px));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(5,18,24,0.52), rgba(3,8,12,0.24));
      box-shadow:
        0 34px 110px rgba(0,0,0,0.42),
        inset 0 1px 0 rgba(255,255,255,0.10);
      backdrop-filter: blur(12px);
    }

    .idle-logo {
      font-size: clamp(38px, 5vw, 72px);
      font-weight: 800;
      color: var(--text);
      letter-spacing: 0;
      line-height: 1;
      text-shadow: 0 0 34px rgba(0,227,253,0.18);
    }

    .cast-ring {
      position: relative;
      width: 214px;
      height: 214px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,227,253,0.22) 0%, rgba(0,227,253,0.08) 42%, rgba(0,0,0,0) 68%);
      box-shadow: 0 0 70px rgba(0,227,253,0.18);
    }

    .cast-ring::before,
    .cast-ring::after {
      content: "";
      position: absolute;
      border: 1px solid rgba(0,227,253,0.32);
      border-radius: 50%;
      opacity: 0;
      animation: signalPulse 3.2s ease-out infinite;
    }

    .cast-ring::before { inset: 8px; }
    .cast-ring::after { inset: -10px; animation-delay: 1.2s; }

    @keyframes signalPulse {
      0% { transform: scale(0.94); opacity: 0; }
      25% { opacity: 0.58; }
      100% { transform: scale(1.08); opacity: 0; }
    }

    .receiver-icon {
      width: 178px;
      height: 178px;
      object-fit: contain;
      image-rendering: auto;
      mix-blend-mode: screen;
      filter:
        brightness(1.08)
        contrast(1.08)
        saturate(1.08)
        drop-shadow(0 0 26px rgba(0,227,253,0.58));
    }

    .idle-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.11);
      font-size: 15px;
      font-weight: 600;
      color: var(--muted);
    }

    .ready-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--mint);
      box-shadow: 0 0 18px rgba(77,255,190,0.8);
      animation: blink 1.8s ease-in-out infinite;
    }

    .signal-bars {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      height: 36px;
      margin-top: 4px;
    }

    .signal-bars span {
      display: block;
      width: 7px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--cyan), var(--mint));
      box-shadow: 0 0 18px rgba(0,227,253,0.42);
      animation: barRise 1.35s ease-in-out infinite;
    }

    .signal-bars span:nth-child(1) { height: 13px; animation-delay: 0s; }
    .signal-bars span:nth-child(2) { height: 22px; animation-delay: 0.15s; }
    .signal-bars span:nth-child(3) { height: 31px; animation-delay: 0.3s; }

    @keyframes barRise {
      0%, 100% { transform: scaleY(0.72); opacity: 0.55; }
      50% { transform: scaleY(1); opacity: 1; }
    }

    #idle-clock {
      position: fixed;
      top: 38px;
      right: 46px;
      text-align: right;
      pointer-events: none;
      z-index: 2;
      padding: 12px 14px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      background: rgba(0,0,0,0.18);
      backdrop-filter: blur(10px);
    }

    #clock-time {
      font-size: 42px;
      font-weight: 300;
      color: var(--text);
      letter-spacing: 0;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    #clock-date {
      font-size: 12px;
      color: rgba(247,251,255,0.5);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-top: 7px;
    }

    .loading-card,
    .error-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 430px;
      padding: 34px 38px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(0,0,0,0.48), inset 0 1px 0 rgba(255,255,255,0.12);
      backdrop-filter: blur(18px);
    }

    .spinner {
      width: 54px; height: 54px;
      border: 3px solid rgba(255,255,255,0.11);
      border-top-color: var(--cyan);
      border-right-color: var(--mint);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 18px;
      box-shadow: 0 0 28px rgba(0,227,253,0.18);
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #loader-status {
      font-size: 16px;
      font-weight: 600;
      color: rgba(247,251,255,0.76);
    }

    .error-icon {
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: rgba(255,82,82,0.14);
      border: 1px solid rgba(255,120,120,0.28);
      color: #ff7a7a;
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .error-title {
      font-size: 22px;
      font-weight: 750;
      color: var(--text);
      margin-bottom: 8px;
    }

    .error-msg {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }

    .error-code {
      margin-top: 12px;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: rgba(247,251,255,0.34);
    }

    #hud {
      position: fixed;
      top: 26px;
      left: 32px;
      z-index: 20;
      display: flex;
      gap: 10px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease, transform 0.4s ease;
      transform: translateY(-6px);
    }

    #hud.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .hud-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      background: rgba(2,8,12,0.64);
      border: 1px solid rgba(255,255,255,0.13);
      border-radius: 999px;
      font-size: 12px;
      color: rgba(247,251,255,0.82);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.04em;
      box-shadow: 0 14px 40px rgba(0,0,0,0.28);
      backdrop-filter: blur(14px);
    }

    .live-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 16px rgba(0,227,253,0.8);
      animation: blink 1.8s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.28; }
    }

    @media (max-width: 720px) {
      .idle-shell {
        min-width: auto;
        width: calc(100vw - 34px);
        padding: 30px 24px 30px;
        border-radius: 24px;
      }

      .cast-ring {
        width: 176px;
        height: 176px;
      }

      .receiver-icon {
        width: 148px;
        height: 148px;
      }

      #idle-clock {
        top: 18px;
        right: 18px;
      }

      #clock-time { font-size: 34px; }
      #hud { left: 18px; top: 18px; }
    }
  </style>
</head>

<body>

  <!-- 1. Player — always at base, NEVER hidden or covered -->
  <cast-media-player></cast-media-player>
  <video id="mirror-video" autoplay playsinline muted></video>

  <!-- 2. Idle screen — shown only when no content is playing -->
  <div id="idle-screen" class="overlay">
    <div class="idle-shell">
      <div class="cast-ring">
        <img class="receiver-icon" src="assets/smartcast-receiver-icon.png" alt="">
      </div>
      <div class="idle-logo">SmartCast Pro</div>
      <div class="idle-label"><span class="ready-dot"></span>Ready to receive</div>
      <div class="signal-bars" aria-hidden="true">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
    <div id="idle-clock">
      <div id="clock-time">00:00</div>
      <div id="clock-date"></div>
    </div>
  </div>

  <!-- 3. Loading — shown only while media is preparing (before first frame) -->
  <div id="loading-overlay" class="overlay hidden">
    <div class="loading-card">
      <div class="spinner"></div>
      <div id="loader-status">Loading…</div>
    </div>
  </div>

  <!-- 4. Error — shown only on failure -->
  <div id="error-overlay" class="overlay hidden">
    <div class="error-card">
      <div class="error-icon">!</div>
      <div class="error-title">Playback Error</div>
      <div class="error-msg" id="error-msg">Unable to play this media.</div>
      <div class="error-code" id="error-code"></div>
    </div>
  </div>

  <!-- 5. HUD pills — float above player, pointer-events none so player still works -->
  <div id="hud">
    <div class="hud-pill">
      <span class="live-dot"></span>
      <span id="hud-state">PLAYING</span>
    </div>
    <div class="hud-pill" id="hud-format" style="display:none"></div>
  </div>

<script>
/* ==============================================
   CAST RECEIVER — v2.0 Fixed
   Key rules:
   1. cast-media-player is NEVER hidden
   2. Overlays only show when there is NO video
   3. During playback ALL overlays are hidden
   4. Buffering uses the player's built-in UI
============================================== */

const context        = cast.framework.CastReceiverContext.getInstance();
const playerManager  = context.getPlayerManager();
const playbackConfig = new cast.framework.PlaybackConfig();
const mirrorNamespace = 'urn:x-cast:com.castingpractice.webrtc';

const idleScreen     = document.getElementById('idle-screen');
const loadingOverlay = document.getElementById('loading-overlay');
const loaderStatus   = document.getElementById('loader-status');
const errorOverlay   = document.getElementById('error-overlay');
const errorMsg       = document.getElementById('error-msg');
const errorCode      = document.getElementById('error-code');
const hud            = document.getElementById('hud');
const hudState       = document.getElementById('hud-state');
const hudFormat      = document.getElementById('hud-format');
const mirrorVideo    = document.getElementById('mirror-video');
const castPlayer     = document.querySelector('cast-media-player');

let hasStartedPlaying = false; // track if we've ever played this session
let currentMediaIsImage = false;
let mirrorMode = false;
let activeSenderId = null;
let peerConnection = null;
let pendingIce = [];
let mirrorRoomId = null;
let signalingSocket = null;

function suppressBuiltInPlayerChrome() {
  if (!castPlayer) return;

  castPlayer.style.setProperty('--progress-color', 'rgba(0,0,0,0)');
  castPlayer.style.setProperty('--play-image', 'none');
  castPlayer.style.setProperty('--pause-image', 'none');
  castPlayer.style.setProperty('--buffering-image', 'none');
  castPlayer.style.setProperty('--watermark-image', 'none');

  const root = castPlayer.shadowRoot;
  if (!root || root.getElementById('smartcast-hide-player-chrome')) return;

  const style = document.createElement('style');
  style.id = 'smartcast-hide-player-chrome';
  style.textContent = `
    .controls,
    .controls-container,
    .media-controls,
    .metadata,
    .metadata-container,
    .progress,
    .progress-bar,
    .progressBar,
    .seek-bar,
    .scrubber,
    .watermark,
    .playback-logo {
      display: none !important;
      opacity: 0 !important;
      visibility: hidden !important;
    }
  `;
  root.appendChild(style);
}

// --- Single state machine: only one screen at a time ---
function showState(state, opts = {}) {
  idleScreen.classList.add('hidden');
  loadingOverlay.classList.add('hidden');
  errorOverlay.classList.add('hidden');
  hud.classList.remove('visible');

  switch (state) {
    case 'idle':
      hasStartedPlaying = false;
      currentMediaIsImage = false;
      hudFormat.style.display = 'none';
      idleScreen.classList.remove('hidden');
      break;

    case 'loading':
      if (!hasStartedPlaying) {
        loadingOverlay.classList.remove('hidden');
        loaderStatus.textContent = opts.msg || 'Loading…';
      }
      break;

    case 'playing':
      hasStartedPlaying = true;
      hudFormat.style.display = 'none';
      suppressBuiltInPlayerChrome();
      break;

    case 'mirroring':
      hasStartedPlaying = true;
      hudState.textContent = 'MIRRORING';
      hud.classList.add('visible');
      break;

    case 'paused':
      hudFormat.style.display = 'none';
      suppressBuiltInPlayerChrome();
      break;

    case 'error':
      hasStartedPlaying = false;
      errorOverlay.classList.remove('hidden');
      errorMsg.textContent  = opts.msg  || 'Unable to play this media.';
      errorCode.textContent = opts.code ? `Code: ${opts.code}` : '';
      break;
  }
}

function setMirrorVisible(visible) {
  mirrorVideo.style.display = visible ? 'block' : 'none';
}

function sendMirrorMessage(type, payload = {}) {
  if (!activeSenderId) return;
  context.sendCustomMessage(mirrorNamespace, activeSenderId, { type, ...payload });
}

function sendSignal(payload) {
  if (!signalingSocket || signalingSocket.readyState !== WebSocket.OPEN || !mirrorRoomId) return;
  signalingSocket.send(JSON.stringify({
    type: 'signal',
    roomId: mirrorRoomId,
    payload
  }));
}

function connectSignaling(signalingUrl, roomId) {
  if (signalingSocket) {
    signalingSocket.close();
    signalingSocket = null;
  }

  mirrorRoomId = roomId;
  signalingSocket = new WebSocket(signalingUrl);

  signalingSocket.onopen = () => {
    signalingSocket.send(JSON.stringify({
      type: 'join',
      roomId,
      role: 'receiver'
    }));
  };

  signalingSocket.onmessage = async (event) => {
    try {
      const message = JSON.parse(event.data);
      if (message.type !== 'signal' || !message.payload) return;

      const payload = message.payload;
      const signalType = payload.type;

      if (signalType === 'offer' && payload.sdp) {
        const pc = await createPeerConnection();
        await pc.setRemoteDescription({ type: 'offer', sdp: payload.sdp });

        // Prefer H264 for better text/detail quality on many TV decoders.
        const caps = RTCRtpReceiver.getCapabilities ? RTCRtpReceiver.getCapabilities('video') : null;
        if (caps && caps.codecs && caps.codecs.length > 0) {
          const h264 = caps.codecs.filter((c) => c.mimeType && c.mimeType.toLowerCase() === 'video/h264');
          const others = caps.codecs.filter((c) => !c.mimeType || c.mimeType.toLowerCase() !== 'video/h264');
          const preferred = [...h264, ...others];
          pc.getTransceivers().forEach((t) => {
            if (t.receiver && t.receiver.track && t.receiver.track.kind === 'video' && t.setCodecPreferences) {
              t.setCodecPreferences(preferred);
            }
          });
        }

        // Low latency playback hints (best-effort, browser-dependent).
        pc.getReceivers().forEach((r) => {
          if (r.track && r.track.kind === 'video') {
            if ('playoutDelayHint' in r) {
              r.playoutDelayHint = 0;
            }
            if ('jitterBufferTarget' in r) {
              r.jitterBufferTarget = 0;
            }
          }
        });

        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal({ type: 'answer', sdp: answer.sdp || '' });
        return;
      }

      if (signalType === 'candidate' && payload.candidate) {
        const ice = new RTCIceCandidate(payload.candidate);
        if (peerConnection && peerConnection.remoteDescription) {
          await peerConnection.addIceCandidate(ice);
        } else {
          pendingIce.push(ice);
        }
      }
    } catch (error) {
      console.error('[Receiver] signaling message error', error);
      sendMirrorMessage('mirrorError', { message: String(error) });
    }
  };

  signalingSocket.onerror = () => {
    sendMirrorMessage('mirrorError', { message: 'Signaling socket error' });
  };

  signalingSocket.onclose = () => {
    signalingSocket = null;
  };
}

async function createPeerConnection() {
  if (peerConnection) return peerConnection;

  peerConnection = new RTCPeerConnection({
    iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
  });

  peerConnection.ontrack = (event) => {
    if (!event.streams || event.streams.length === 0) return;
    mirrorVideo.srcObject = event.streams[0];
    setMirrorVisible(true);
    mirrorMode = true;
    showState('mirroring');
    sendMirrorMessage('mirrorStarted');
  };

  peerConnection.onicecandidate = (event) => {
    if (event.candidate) {
      sendSignal({ type: 'candidate', candidate: event.candidate });
    }
  };

  peerConnection.onconnectionstatechange = () => {
    if (!peerConnection) return;
    const state = peerConnection.connectionState;
    if (state === 'failed' || state === 'closed') {
      resetMirrorSession();
    }
  };

  for (const candidate of pendingIce) {
    try {
      await peerConnection.addIceCandidate(candidate);
    } catch (e) {
      console.error('[Receiver] Failed to apply pending ICE', e);
    }
  }
  pendingIce = [];

  return peerConnection;
}

function resetMirrorSession() {
  pendingIce = [];

  if (peerConnection) {
    peerConnection.ontrack = null;
    peerConnection.onicecandidate = null;
    peerConnection.onconnectionstatechange = null;
    peerConnection.close();
    peerConnection = null;
  }

  if (signalingSocket) {
    signalingSocket.close();
    signalingSocket = null;
  }

  mirrorRoomId = null;
  mirrorVideo.srcObject = null;
  setMirrorVisible(false);
  mirrorMode = false;

  if (playerManager.getPlayerState() === PS.PLAYING) {
    showState('playing');
  } else if (playerManager.getPlayerState() === PS.PAUSED) {
    showState('paused');
  } else {
    showState('idle');
  }
}

context.addCustomMessageListener(mirrorNamespace, async (event) => {
  try {
    const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
    const type = data?.type;
    activeSenderId = event.senderId || activeSenderId;

    if (type === 'startMirrorWS') {
      const roomId = data.roomId;
      const signalingUrl = data.signalingUrl;
      if (!roomId || !signalingUrl) {
        throw new Error('Missing roomId or signalingUrl');
      }

      playerManager.stop();
      showState('loading', { msg: 'Starting mirroring…' });
      connectSignaling(signalingUrl, roomId);
      return;
    }

    if (type === 'stopMirror') {
      resetMirrorSession();
      sendMirrorMessage('mirrorStopped');
    }
  } catch (error) {
    console.error('[Receiver] Mirror message error', error);
    sendMirrorMessage('mirrorError', { message: String(error) });
  }
});

// --- MIME detection ---
function isImageMime(contentType) {
  return (contentType || '').toLowerCase().startsWith('image/');
}

function detectMime(url) {
  const u = (url || '').split('?')[0].toLowerCase();
  if (u.endsWith('.m3u8'))  return 'application/x-mpegURL';
  if (u.endsWith('.mpd'))   return 'application/dash+xml';
  if (u.endsWith('.webm'))  return 'video/webm';
  if (u.endsWith('.mkv'))   return 'video/x-matroska';
  if (u.endsWith('.mp3'))   return 'audio/mpeg';
  if (u.endsWith('.aac'))   return 'audio/aac';
  return 'video/mp4';
}

// --- Clock ---
function updateClock() {
  const now  = new Date();
  const hh   = String(now.getHours()).padStart(2, '0');
  const mm   = String(now.getMinutes()).padStart(2, '0');
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock-time').textContent = `${hh}:${mm}`;
  document.getElementById('clock-date').textContent =
    `${days[now.getDay()]} ${mons[now.getMonth()]} ${now.getDate()}`;
}
updateClock();
setInterval(updateClock, 15000);

/* ── LOAD INTERCEPTOR ── */
playerManager.setMessageInterceptor(
  cast.framework.messages.MessageType.LOAD,
  (request) => {
    const media = request.media;

    if (!media.contentUrl && media.contentId) {
      media.contentUrl = media.contentId;
    }

    if (!media.contentType) {
      media.contentType = detectMime(media.contentUrl);
    }

    currentMediaIsImage = isImageMime(media.contentType);

    hudFormat.style.display = 'none';

    showState('loading', { msg: 'Loading media…' });
    suppressBuiltInPlayerChrome();

    return request;
  }
);

/* ── PLAYER EVENTS ── */
const EV = cast.framework.events.EventType;
const PS = cast.framework.messages.PlayerState;

playerManager.addEventListener(EV.MEDIA_STATUS, (event) => {
  if (mirrorMode) return;
  if (!event.mediaStatus) return;
  const state = event.mediaStatus.playerState;

  if (state === PS.PLAYING) {
    // This is the critical one — hide ALL overlays
    showState('playing');
  } else if (state === PS.PAUSED) {
    showState('paused');
  } else if (state === PS.BUFFERING) {
    // Do NOT show our loading overlay — let cast-media-player handle buffering UI
    // Only show loading if we haven't played yet
    if (!hasStartedPlaying) {
      loaderStatus.textContent = 'Buffering…';
    }
  } else if (state === PS.IDLE) {
    const reason = event.mediaStatus.idleReason;
    if (reason === 'FINISHED' || reason === 'CANCELLED' || reason === 'ERROR') {
      showState('idle');
    }
  }
});

// This fires when media is fully loaded and ready — most reliable signal
playerManager.addEventListener(EV.PLAYER_LOAD_COMPLETE, () => {
  if (mirrorMode) return;
  console.log('[Receiver] Load complete — showing video');
  showState('playing');
});

playerManager.addEventListener(EV.ERROR, (event) => {
  if (mirrorMode) return;
  console.error('[Receiver] Error:', JSON.stringify(event));
  showState('error', {
    msg: 'Could not play this media. Check the URL or format.',
    code: event.detailedErrorCode || ''
  });
});

playerManager.addEventListener(EV.ENDED, () => {
  if (mirrorMode) return;
  showState('idle');
});

/* ── CONTEXT EVENTS ── */
context.addEventListener(cast.framework.system.EventType.READY, () => {
  console.log('[Receiver] Ready');
  suppressBuiltInPlayerChrome();
  showState('idle');
});

context.addEventListener(cast.framework.system.EventType.SENDER_CONNECTED, (e) => {
  console.log('[Receiver] Sender connected:', e.senderId);
});

context.addEventListener(cast.framework.system.EventType.SENDER_DISCONNECTED, (e) => {
  console.log('[Receiver] Sender disconnected:', e.senderId);
  if (e.senderId === activeSenderId) {
    resetMirrorSession();
    activeSenderId = null;
  }
});

/* ── START ── */
context.start({ playbackConfig });
console.log('[Receiver] Started v2.0');
</script>
